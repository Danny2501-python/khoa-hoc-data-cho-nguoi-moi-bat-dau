// Do not overwrite a known-open server-rendered exam list with an empty AJAX response.
async function syncCatalog(){
  const previous=S.boot && Array.isArray(S.boot.exams)?S.boot.exams:[];
  const incoming=await call('getBootstrap');
  if(!incoming || !Array.isArray(incoming.exams)) throw Error('Máy chủ trả dữ liệu đề không hợp lệ.');

    S.catalogNotice='Máy chủ trả danh sách rỗng ở lần tải lại; đang giữ '+previous.length+' đề đã xác minh khi mở trang.';
    return S.boot;
  }
  S.boot=incoming;
  S.catalogNotice='';
  return incoming;
}

async function refreshHome(){try{await wrap(async()=>{await syncCatalog();renderHome()})}catch(e){S.catalogNotice='Không cập nhật được danh sách: '+e.message;renderHome()}}
async function openExamByCode(){const el=$('manualExamCode');const id=String(el?.value||'').trim().toUpperCase();if(!/^[A-Z0-9_-]{3,64}$/.test(id)){toast('Nhập mã đề hợp lệ.');return}try{await showExam(id)}catch(e){toast('Không mở được đề: '+e.message)}}
async function showExam(id){await wrap(async()=>{S.exam=await call('getExamInfo',id);S.page='ready';nav('home');renderReady()})}
function renderReady(){const e=S.exam;
 $('app').innerHTML=`<div class="section-head"><div><h2>${esc(e.title)}</h2><p>Một link chung, mỗi lượt làm nhận bộ câu hỏi được chọn riêng; câu hỏi và vị trí đáp án đều được xáo trộn. Điểm được so sánh theo cùng số câu và cơ cấu chương.</p></div><span class="badge">${e.count} câu · ${e.duration?e.duration+' phút':'Không giới hạn'}</span></div>
 <div class="split"><div class="card"><h3>Thông tin người làm bài</h3><div class="field"><label for="participantName">Họ tên (bắt buộc)</label><input class="input" id="participantName" placeholder="Ví dụ: Nguyễn Văn A" maxlength="70" autocomplete="name"></div><div class="field"><label for="participantCode">Mã người làm / Mã nhân viên (không bắt buộc)</label><input class="input" id="participantCode" placeholder="Để phân biệt người trùng tên" maxlength="45"></div><div class="action-row" style="margin-top:16px"><button class="btn" onclick="beginExam()">Bắt đầu làm bài →</button><button class="btn secondary" onclick="copy(examLink('${esc(e.id)}'))">🔗 Sao chép link đề</button></div></div>
 <div class="card"><h3>Quy định làm bài</h3><p>✔ Câu hỏi khác nhau theo lượt thi; cùng số câu và cơ cấu chủ đề.</p><p>✔ Đáp án đúng và giải thích chỉ xuất hiện sau khi nộp.</p><p>✔ Kết quả được lưu trên Google Sheets, có thống kê theo chương.</p><p>✔ Đề này: <b>${e.duration?e.duration+' phút':'không giới hạn thời gian'}</b>.</p><div class="warning">Chỉ nhập tên/mã cần thiết. Không nhập mật khẩu hoặc thông tin nhạy cảm vào biểu mẫu.</div></div></div>`;
}
async function beginExam(){const name=$('participantName').value.trim(),code=$('participantCode').value.trim();if(name.length<2){toast('Nhập họ tên ít nhất 2 ký tự.');return}
 await wrap(async()=>{const d=await call('startAttempt',{examId:S.exam.id,name,participantCode:code});S.attempt=d;S.index=0;S.answers={};S.result=null;S.page='quiz';persistAttempt();renderQuiz();startTimer();window.scrollTo(0,0)})}
function persistAttempt(){try{sessionStorage.setItem('tf-online-attempt',JSON.stringify({...S.attempt,answers:S.answers,index:S.index}))}catch(_){}}
function remaining(){if(!S.attempt||!S.exam.duration)return Infinity;return Math.max(0,S.exam.duration*60-Math.floor((Date.now()-new Date(S.attempt.startedAt).getTime())/1000))}
function startTimer(){clearInterval(S.timer);if(!S.exam.duration)return;S.timer=setInterval(()=>{if(S.page!=='quiz'){clearInterval(S.timer);return}const x=remaining(),el=$('timer');if(el){el.textContent=fmtTime(x);el.classList.toggle('urgent',x<=60)}if(x===0){clearInterval(S.timer);submitExam(true)}},1000)}
function renderQuiz(){const qs=S.attempt.questions,q=qs[S.index],a=S.answers[q.id];const n=Object.keys(S.answers).length;
 $('app').innerHTML=`<div class="section-head"><div><h2>${esc(S.exam.title)}</h2><p>Học viên: ${esc(S.attempt.name || 'Đang làm bài')} · Đã chọn ${n}/${qs.length} câu</p></div><span class="badge green">Đang làm bài</span></div><div class="split"><div class="card"><div class="qhead"><span class="badge">Câu ${S.index+1} / ${qs.length}</span><span class="mini">${esc(q.categoryLabel)} · ${esc(q.level)}</span></div><div class="progress"><div class="bar" style="width:${(S.index+1)/qs.length*100}%"></div></div><div class="question">${esc(q.question)}</div>${q.options.map((v,i)=>`<button class="choice ${a===i?'active':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('')}
 <div class="row between" style="margin-top:25px;border-top:1px solid var(--line);padding-top:17px"><button class="btn secondary" onclick="changeQ(-1)" ${S.index===0?'disabled':''}>← Câu trước</button>${S.index<qs.length-1?`<button class="btn" onclick="changeQ(1)">Câu tiếp →</button>`:`<button class="btn" onclick="submitExam(false)">Nộp bài ✓</button>`}</div></div>
 <div class="card"><h3>Thông tin bài thi</h3><div class="row between"><span class="mini">Thời gian còn</span><b id="timer" class="timer">${S.exam.duration?fmtTime(remaining()):'∞'}</b></div><p class="mini">${n} câu đã trả lời · ${qs.length-n} câu chưa chọn</p><div class="palette">${qs.map((v,i)=>`<button class="${i===S.index?'current':''} ${Object.prototype.hasOwnProperty.call(S.answers,v.id)?'filled':''}" onclick="setQ(${i})">${i+1}</button>`).join('')}</div><button class="btn block" style="margin-top:18px" onclick="submitExam(false)">Nộp bài và xem điểm</button><p class="mini">Nếu hết giờ, hệ thống sẽ tự nộp bài. Hạn tính từ lúc bạn bấm bắt đầu.</p></div></div>`;
}
function choose(n){const q=S.attempt.questions[S.index];S.answers[q.id]=n;persistAttempt();renderQuiz()}
function setQ(n){S.index=Math.min(S.attempt.questions.length-1,Math.max(0,n));persistAttempt();renderQuiz();window.scrollTo(0,0)}
function changeQ(n){setQ(S.index+n)}
async function submitExam(auto){if(S.page!=='quiz')return;const missing=S.attempt.questions.length-Object.keys(S.answers).length;if(!auto && !confirm(`Nộp bài? ${missing} câu chưa trả lời sẽ được tính sai.`))return;
 clearInterval(S.timer);try{await wrap(async()=>{const r=await call('submitAttempt',{attemptId:S.attempt.attemptId,answers:S.answers});S.result=r;S.page='result';sessionStorage.removeItem('tf-online-attempt');renderResult();window.scrollTo(0,0)})}catch(_){if(S.page==='quiz')startTimer()}}
function renderResult(){nav('home');const r=S.result;
 $('app').innerHTML=`<section class="hero"><div class="kicker">Kết quả đã nộp và lưu trên Google Sheets</div><h1>${r.percent}% · ${r.score}/${r.total} câu đúng</h1><p>Chúc mừng ${esc(r.name)} đã hoàn thành “${esc(r.exam.title)}”. ${r.late?'Lưu ý: bài nộp quá thời gian quy định.':''}</p><div class="chips"><span class="chip">${r.percent>=70?'Đạt mốc 70%':'Cần ôn tập thêm'}</span><span class="chip">Thời gian ${fmtTime(r.elapsedSeconds)}</span><span class="chip">Đã trả lời ${r.answered}/${r.total} câu</span></div></section><div class="section-head"><div><h2>Chữa bài chi tiết</h2><p>Xem lời giải, nguồn đối chiếu và các câu cần học lại.</p></div><button class="btn secondary" onclick="goHome()">Về danh sách đề</button></div>
 <div class="card"><div class="row between"><h3 style="margin:0">Bộ lọc</h3><select id="reviewFilter" class="input" style="width:auto" onchange="renderReviewList()"><option value="wrong">Chỉ câu sai/chưa làm</option><option value="all">Tất cả câu</option><option value="right">Chỉ câu đúng</option></select></div><div id="reviewBody"></div></div>`;renderReviewList();}
function renderReviewList(){const val=$('reviewFilter').value,qs=S.result.review.filter(q=>val==='all'||(val==='right'?q.isCorrect:!q.isCorrect));$('reviewBody').innerHTML=qs.length?qs.map((q)=>`<div class="review-card ${q.isCorrect?'correct':'incorrect'}"><div class="row between"><b>${esc(q.id)} · ${esc(q.categoryLabel)}</b><span class="badge ${q.isCorrect?'green':'red'}">${q.isCorrect?'Đúng':'Chưa đúng'}</span></div><p><b>${esc(q.question)}</b></p>${q.options.map((o,i)=>`<div class="review-opt ${i===q.correctIndex?'right':(i===q.selected?'wrong':'')}">${'ABCD'[i]}. ${esc(o)} ${i===q.correctIndex?'✓ Đúng':(i===q.selected?'✕ Đã chọn':'')}</div>`).join('')}<div class="review-expl"><b>Giải thích:</b> ${esc(q.explanation)}<div class="mini">Nguồn: ${esc(q.source)}</div></div></div>`).join(''):'<div class="empty">Không có câu trong nhóm này.</div>'}
function openAdmin(){S.page='admin';nav('admin');if(S.adminPin)refreshAdmin();else renderAdminLogin()}
function renderAdminLogin(){$('app').innerHTML=`<div class="section-head"><div><div class="eyebrow">ADMIN CONSOLE</div><h2>Quản trị & phân tích kết quả</h2><p>Theo dõi từng lượt làm, chủ đề cần ôn tập và tạo đề thi cho nhóm.</p></div></div><div class="card login-card"><div class="login-intro"><div class="admin-lock">▣</div><h2>Đăng nhập quản trị</h2><p class="muted" style="font-size:13px">Chỉ người tổ chức có mã quản trị mới được xem bảng điểm và tạo đề.</p></div><div class="admin-spotlight"><span>ⓘ</span><span>Lấy mã tại <b>Apps Script → Cài đặt dự án → Thuộc tính tập lệnh → ADMIN_PIN</b>.</span></div><div class="field"><label for="adminPin">Mã quản trị (ADMIN_PIN)</label><div class="password-wrap"><input type="password" class="input" id="adminPin" placeholder="Nhập mã quản trị" autocomplete="off" onkeydown="if(event.key==='Enter')adminLogin()"><button type="button" class="pin-toggle" onclick="togglePin()" id="pinToggle">Hiện</button></div></div><button class="btn" onclick="adminLogin()">Mở bảng thống kê →</button><p class="mini" style="margin-top:17px;text-align:center">Chỉ chia sẻ link đề thi với học viên, không chia sẻ mã quản trị.</p></div>`;}
function togglePin(){const el=$('adminPin');if(!el)return;const show=el.type==='password';el.type=show?'text':'password';const b=$('pinToggle');if(b)b.textContent=show?'Ẩn':'Hiện';}

async function adminLogin(){const pin=$('adminPin').value.trim();if(!pin){toast('Nhập mã quản trị.');return}try{await wrap(async()=>{const d=await call('adminGetOverview',pin,S.selectedAdminExam);S.adminPin=pin;S.adminData=d;S.selectedAdminExam=d.selected?.id||'';renderAdmin()})}catch(_){}}
async function refreshAdmin(id){try{await wrap(async()=>{S.adminData=await call('adminGetOverview',S.adminPin,id||S.selectedAdminExam);S.selectedAdminExam=S.adminData.selected?.id||'';S.boot=await call('getBootstrap');renderAdmin()})}catch(_){S.adminPin='';renderAdminLogin()}}
function renderAdmin(){const d=S.adminData;if(!d?.selected){$('app').innerHTML='<div class="card"><h2>Chưa có đề thi</h2><p>Hãy chạy hàm thiết lập để tạo đề đầu tiên.</p></div>';return}
 $('app').innerHTML=`<div class="section-head"><div><h2>Dashboard · Tổng hợp kết quả</h2><p>Bảng điểm và mức độ nắm vững kiến thức của cả nhóm theo từng đề.</p></div><button class="btn secondary small" onclick="refreshAdmin()">↻ Cập nhật</button></div>
 <div class="card"><div class="row between"><div class="field" style="margin:0;min-width:245px;flex:1"><label>Đề đang xem</label><select id="adminExam" class="input" onchange="refreshAdmin(this.value)">${d.exams.map(e=>`<option value="${esc(e.id)}" ${e.id===d.selected.id?'selected':''}>${esc(e.title)} · ${e.count} câu ${e.status==='closed'?'(đã đóng)':''}</option>`).join('')}</select></div><div class="action-row" style="align-self:end"><button class="btn secondary" onclick="copy(examLink('${esc(d.selected.id)}'))">🔗 Copy link đề</button><button class="btn secondary" onclick="toggleExam()">${d.selected.status==='open'?'Đóng đề':'Mở lại'}</button><button class="btn" onclick="showCreateForm()">+ Tạo đề mới</button></div></div><p class="mini">Mã đề: ${esc(d.selected.id)} · ${d.selected.count} câu · ${d.selected.duration?d.selected.duration+' phút':'không giới hạn'} · Trạng thái: ${d.selected.status==='open'?'đang mở':'đã đóng'}</p></div>
 <div class="stats"><div class="stat"><b>${d.stats.uniqueParticipants}</b><small>Người tham gia*</small></div><div class="stat"><b>${d.stats.submissions}</b><small>Bài đã nộp</small></div><div class="stat"><b>${d.stats.avgScore}%</b><small>Điểm trung bình</small></div><div class="stat"><b>${d.stats.passCount}</b><small>Bài đạt ≥70%</small></div></div>
 <div class="note" style="margin:14px 0 20px">🎲 Phân phối đề cá nhân: đã sử dụng <b>${d.stats.distinctQuestions}</b> câu hỏi khác nhau trên <b>${d.stats.poolQuestions}</b> câu khả dụng; <b>${d.stats.reusedQuestions}</b> lượt câu được tái sử dụng khi tạo đề. Câu được lặp giữa các thí sinh là không tránh khỏi nếu số lượt làm tăng.</div>
 <div class="report-grid"><div class="card"><h3>📉 Điểm yếu của cả nhóm theo chương</h3>${d.topics.length?d.topics.map(t=>`<div class="topic-row"><div class="row between"><b style="font-size:13px">${esc(t.label)}</b><b style="color:${t.total&&t.accuracy<70?'#c43d51':'#087f5b'}">${t.total?t.accuracy+'%':'—'}</b></div><div class="topic-bar"><div class="${t.accuracy<50?'verylow':t.accuracy<70?'low':''}" style="width:${t.accuracy}%"></div></div><span class="mini">${t.total?t.correct+'/'+t.total+' lượt trả lời đúng':'Chưa có bài nộp'} ${t.total&&t.accuracy<70?'· Nên ôn lại':''}</span></div>`).join(''):'<p class="muted">Chưa có dữ liệu.</p>'}<div class="note" style="margin-top:14px">Đúng dưới 70% được đánh dấu cần ôn. Tỷ lệ được tính trên các câu thuộc chương đã xuất hiện trong đề này, không đại diện cho toàn bộ 213 câu.</div></div>
 <div class="card"><h3>🔎 Top câu sai nhiều nhất</h3>${d.questions.filter(q=>q.total>0).slice(0,9).map((q,i)=>`<div class="wrong-q"><div class="row between"><b style="font-size:12px">${i+1}. ${esc(q.id)} · ${esc(q.categoryLabel)}</b><span class="badge ${q.accuracy<70?'red':'green'}">Sai ${q.wrong}/${q.total}</span></div><p style="font-size:13px">${esc(q.question)}</p></div>`).join('')||'<p class="muted">Chưa có bài nộp.</p>'}<div class="note" style="margin-top:14px">Số lượt làm ít thì tỷ lệ sai chưa ổn định. Nên xem cả số lần trả lời của mỗi câu.</div></div></div>
 <div class="section-head"><div><h2>🏆 Bảng điểm từng người</h2><p>${d.stats.pending} lượt đang làm/chưa nộp · ${d.stats.lateCount} lượt nộp quá giờ</p></div><div class="action-row"><button class="btn secondary small" onclick="exportCSV('scores')">Xuất điểm CSV</button><button class="btn secondary small" onclick="exportCSV('topics')">Xuất chương yếu CSV</button><button class="btn secondary small" onclick="exportCSV('questions')">Xuất câu sai CSV</button></div></div>
 <div class="card table-wrap">${d.participants.length?`<table class="table"><thead><tr><th>#</th><th>Họ tên</th><th>Mã / nhóm</th><th>Điểm</th><th>Tỷ lệ</th><th>Thời gian</th><th>Nộp lúc</th></tr></thead><tbody>${d.participants.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b>${p.late?' <span class="badge red">Quá giờ</span>':''}</td><td>${esc(p.code||'—')}</td><td>${p.score}/${p.total}</td><td class="score">${p.percent}%</td><td>${fmtTime(p.seconds)}</td><td>${esc(fmtDate(p.at))}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Chưa có ai nộp bài. Sao chép link đề để gửi cho nhóm.</div>'}</div>
 <footer>*Số người ước tính theo mã tự khai (nếu có), nếu không thì theo họ tên; không xác minh danh tính, có thể trùng lặp. Điểm trung bình tính theo bài đã nộp.</footer>`;
}
function csvEscape(v){let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(type){const d=S.adminData;let rows;if(type==='scores')rows=[['Họ tên','Mã người làm','Số đúng','Tổng câu','Điểm (%)','Thời gian (giây)','Ngày nộp','Quá giờ'],...d.participants.map(p=>[p.name,p.code,p.score,p.total,p.percent,p.seconds,p.at,p.late?'Có':'Không'])];else if(type==='topics')rows=[['Chương','Số đúng','Tổng lượt','Tỷ lệ đúng (%)','Nhận xét'],...d.topics.map(t=>[t.label,t.correct,t.total,t.accuracy,t.total&&t.accuracy<70?'Cần ôn':''])];else rows=[['Câu hỏi ID','Chương','Nội dung câu hỏi','Số sai','Tổng lượt','Tỷ lệ đúng (%)','Nguồn'],...d.questions.map(q=>[q.id,q.categoryLabel,q.question,q.wrong,q.total,q.accuracy,q.source])];
 const csv='\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`trade_finance_${type}_${d.selected.id}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function toggleExam(){const d=S.adminData;const open=d.selected.status!=='open';if(!confirm(`${open?'Mở lại':'Đóng'} đề “${d.selected.title}”?`))return;await wrap(async()=>{await call('adminToggleExam',S.adminPin,d.selected.id,open);await refreshAdmin()})}
function showCreateForm(){const cats=S.boot.categories;
 $('app').innerHTML=`<div class="section-head"><div><h2>Tạo đề thi cho nhóm</h2><p>Mỗi lượt làm được tạo bộ câu hỏi khác nhau từ ngân hàng theo chủ đề và độ khó. Hệ thống ưu tiên câu chưa được sử dụng.</p></div><button class="btn secondary" onclick="renderAdmin()">← Về dashboard</button></div><div class="split"><div class="card"><div class="field"><label>Tên đề thi</label><input id="newTitle" class="input" placeholder="Ví dụ: Kiểm tra Trade Finance - Team A"></div><div class="form-grid"><div class="field"><label>Số câu hỏi</label><select id="newCount" class="input"><option value="10">10 câu</option><option value="20">20 câu</option><option value="30" selected>30 câu</option><option value="40">40 câu</option><option value="80">80 câu</option><option value="213">Tất cả câu phù hợp</option></select></div><div class="field"><label>Thời gian</label><select id="newDuration" class="input"><option value="0">Không giới hạn</option><option value="15">15 phút</option><option value="30" selected>30 phút</option><option value="45">45 phút</option><option value="60">60 phút</option><option value="90">90 phút</option></select></div></div><div class="field"><label>Độ khó</label><select id="newLevel" class="input"><option value="all">Tất cả</option><option value="Cơ bản">Cơ bản</option><option value="Trung bình">Trung bình</option><option value="Nâng cao">Nâng cao</option></select></div><div class="field"><label>Chương lấy câu hỏi</label><div class="checkboxes">${cats.map(c=>`<label><input type="checkbox" name="newCat" value="${esc(c.id)}" checked><span><b>${esc(c.label)}</b><br>${esc(c.description)}</span></label>`).join('')}</div></div><button class="btn" onclick="createExam()">Tạo đề & lấy link chia sẻ →</button></div><div class="card"><h3>Mẹo tổ chức kiểm tra</h3><p>1. Tạo cấu hình đề: số câu, chương, độ khó.</p><p>2. Gửi cùng link: mỗi người nhận bộ câu hỏi riêng.</p><p>3. Chờ học viên nộp bài.</p><p>4. Vào dashboard để xem câu sai nhiều và chủ đề cần giảng lại.</p><div class="warning">Ngân hàng có 213 câu: khi số lượt làm × số câu vượt 213, không thể bảo đảm các câu hoàn toàn không trùng. Hệ thống giảm trùng tối đa, nhưng vẫn có thể trùng câu. Danh tính người làm chưa được xác minh.</div></div></div>`;
}
async function createExam(){const config={title:$('newTitle').value,count:Number($('newCount').value),duration:Number($('newDuration').value),level:$('newLevel').value,categories:[...document.querySelectorAll('[name=newCat]:checked')].map(x=>x.value)};
 try{await wrap(async()=>{const e=await call('adminCreateExam',S.adminPin,config);S.selectedAdminExam=e.id;await refreshAdmin(e.id);toast('Đã tạo đề. Bấm Copy link đề để gửi cho nhóm.')})}catch(_){}}
initialize();
</script></body></html>
